name: Run tests and upload coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests with pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies with CPU-only torch
        shell: bash
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            | grep -vE '^(nvidia-|cuda-|triton==)' > ci-requirements.txt
          uv pip install -r ci-requirements.txt --torch-backend cpu
          uv pip install --no-deps -e .

      - name: Run tests under coverage
        shell: bash
        run: |
          uv run --no-sync coverage run --source=model2vec -m pytest --ignore=tests/integration
          uv run --no-sync coverage report

      - name: Upload results to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
